name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-backend:
    name: 后端代码检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio coverage flasgger

      - name: Ruff Lint 检查
        run: |
          source venv/bin/activate
          ruff check app/ tests/
          echo "✅ Ruff 检查通过"

      - name: Ruff Format 检查（可选）
        run: |
          source venv/bin/activate
          ruff format --check app/ tests/ || true
          continue-on-error: true

  test-backend:
    name: 后端测试套件
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: lint-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      TESTING: "true"
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖 & 创建虚拟环境
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-asyncio coverage flask testing aiosqlite flasgger pydantic pydantic-settings sqlalchemy flask-socketio

      - name: 运行单元测试 + 覆盖率
        run: |
          source venv/bin/activate
          coverage run -m pytest tests/ \
            -v --tb=short \
            --ignore=tests/test_integration.py \
            -q 2>&1 | tail -30
          coverage report -m --fail-under=0
          coverage html -d htmlcov/

      - name: 运行集成测试
        run: |
          source venv/bin/activate
          python -m pytest tests/test_integration.py \
            -v --tb=short -q 2>&1 | tail -20

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/htmlcov/
          retention-days: 7

  lint-frontend:
    name: 前端代码检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: ESLint 检查
        run: npx next lint || true
        continue-on-error: true

  test-frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com

      - name: 运行 Jest 测试
        run: npx jest --ci --coverage --verbose 2>&1 | tail -40

      - name: Next.js 构建
        run: npx next build 2>&1 | tail -20
